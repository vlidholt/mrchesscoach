services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mrchesscoach
      POSTGRES_PASSWORD: "LwsSfZVLT1ah4NZSetWuYxHnhWbhM_9P"
    volumes:
      - mrchesscoach_data:/var/lib/postgresql/data


  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mrchesscoach_test
      POSTGRES_PASSWORD: "_Z6AsOj7ZAtWPsHVSaLDFkfXZJrLovAW"
    volumes:
      - mrchesscoach_test_data:/var/lib/postgresql/data


volumes:
  mrchesscoach_data:
  mrchesscoach_test_data:
